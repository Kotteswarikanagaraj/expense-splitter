spring.application.name=smart-expense-splitter

# ---------- Datasource ----------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/expense_splitter?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Root123}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------- JWT ----------
jwt.secret=${JWT_SECRET:ThisIsADemoSecretKeyForExpenseSplitterPleaseChangeInProd123456}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------- CORS (for your deployed frontend) ----------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

server.port=${PORT:8080}

