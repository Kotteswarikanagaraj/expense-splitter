spring.application.name=smart-expense-splitter

# ---------- Datasource (MySQL) ----------
spring.datasource.url=jdbc:mysql://localhost:3306/expense_splitter?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
# ddl-auto=update is fine for a resume project / dev. In a real prod system you'd
# use Flyway/Liquibase migrations instead and set this to "validate".
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------- JWT ----------
# In real deployments this secret comes from an env var / secrets manager, never committed.
jwt.secret=ThisIsADemoSecretKeyForExpenseSplitterPleaseChangeInProd123456
jwt.expiration-ms=86400000

server.port=8080
